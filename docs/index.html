<!-- docs/index.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Documentación CRM Básico</title>

  <!-- Cargar Swagger UI desde CDN -->
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css">
  <style>
    body {
      margin: 0;
      padding: 0;
    }
    #swagger-ui {
      margin: 2rem;
    }
  </style>
</head>

<body>
  <div id="swagger-ui"></div>

  <!-- Cargar Swagger UI y configurar -->
  <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
  <script>
    const ui = SwaggerUIBundle({
      url: './swagger.json', // ← Apunta al archivo swagger.json en la misma carpeta docs
      dom_id: '#swagger-ui',
    });
  </script>
</body>
</html>
